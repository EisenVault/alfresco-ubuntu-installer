# =============================================================================
# Alfresco Community Edition 26.2 - Component Versions
# =============================================================================
# Current release line (2026)
# Java 21 required, Tomcat 10.x supported
#
# Search backend: OpenSearch (Alfresco Search Community) replaces Solr.
# The repository indexes content through its internal 'elasticsearch' subsystem,
# fed by the standalone Alfresco Elasticsearch Batch Indexing application.
# Solr / Alfresco Search Services is NOT installed for this profile.
# =============================================================================

# -----------------------------------------------------------------------------
# Core Alfresco Components
# -----------------------------------------------------------------------------
ALFRESCO_VERSION="26.2.0"
# Share is shipped as a standalone WAR to override the insecure share.war
# bundled in the 26.2.0 ACS distribution. 26.2.0 is insecure; the first
# secure release is the 26.2.1 line. When SHARE_VERSION is set, scripts 05/06
# download org/alfresco/share/${SHARE_VERSION}/share-${SHARE_VERSION}.war and
# use it in place of the bundled share.war.
SHARE_VERSION="26.2.1.2"
# ALFRESCO_SEARCH_VERSION is unused when SEARCH_BACKEND=opensearch (kept for
# schema compatibility with the download/validate tooling).
ALFRESCO_SEARCH_VERSION="2.0.18"
ALFRESCO_TRANSFORM_VERSION="5.4.3"
ALFRESCO_PDF_RENDERER_VERSION="1.2"

# -----------------------------------------------------------------------------
# Search Backend (Alfresco Search Community / OpenSearch)
# -----------------------------------------------------------------------------
# solr       -> Alfresco Search Services (Solr 6), scripts 05/07 install Solr
# opensearch -> OpenSearch + batch-indexer, scripts 07-DO-NOT-USE-install_opensearch.sh
#               and 07b-DO-NOT-USE-install_batch_indexer.sh
SEARCH_BACKEND="opensearch"
OPENSEARCH_VERSION="2.19.3"
BATCH_INDEXER_VERSION="5.7.0"

# -----------------------------------------------------------------------------
# Infrastructure Components
# -----------------------------------------------------------------------------
POSTGRESQL_VERSION="16"
TOMCAT_VERSION="10.1.48"
ACTIVEMQ_VERSION="6.2.1"

# -----------------------------------------------------------------------------
# Frontend Components
# -----------------------------------------------------------------------------
ACA_VERSION="8.0.0"
NODEJS_VERSION="24"

# -----------------------------------------------------------------------------
# Java Runtime
# -----------------------------------------------------------------------------
JAVA_VERSION="21"

# -----------------------------------------------------------------------------
# Version Fetching Behavior
# -----------------------------------------------------------------------------
USE_LATEST_VERSIONS="false"
